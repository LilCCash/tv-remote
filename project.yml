# Genera il progetto Xcode con XcodeGen:  brew install xcodegen && xcodegen generate
name: XiaomiRemote
options:
  bundleIdPrefix: it.example        # <- cambialo con un prefisso tuo (deve essere univoco)
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  XiaomiRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Xiaomi Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Serve per trovare la tua TV sulla rete Wi-Fi e inviarle i comandi del telecomando. Nessun dato lascia la tua rete."
        NSBonjourServices:
          - _androidtvremote2._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.example.xiaomiremote   # <- deve coincidere col tuo prefisso
        TARGETED_DEVICE_FAMILY: "1"                          # solo iPhone
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: ABCDE12345                       # <- il tuo Team ID (oppure sceglilo in Xcode)
  XiaomiRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: XiaomiRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: it.example.xiaomiremote.tests
