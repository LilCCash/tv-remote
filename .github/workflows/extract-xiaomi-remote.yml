name: Extract XiaomiRemote archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract project files
        shell: bash
        run: |
          set -euo pipefail
          test -f XiaomiRemote.zip || { echo "XiaomiRemote.zip not found in repository root"; exit 1; }
          mkdir -p /tmp/xiaomi-archive
          unzip -q XiaomiRemote.zip -d /tmp/xiaomi-archive
          PROJECT_FILE="$(find /tmp/xiaomi-archive -type f -name project.yml -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Could not find project.yml in the ZIP. Archive contents:"
            find /tmp/xiaomi-archive -maxdepth 4 -print
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "Copying project from: $PROJECT_DIR"
          cp -R "$PROJECT_DIR"/. .
          echo "Extracted files:"
          find . -maxdepth 4 -type f -not -path './.git/*' -not -name 'XiaomiRemote.zip' | sort

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract XiaomiRemote project files"
          git push origin HEAD:main
